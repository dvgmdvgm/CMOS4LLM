[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/memory",
    "crates/sub-lm",
    "crates/gateway",
    "crates/policy",
    "crates/retrieval",
    "crates/cli",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/nickabal/cmos"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
